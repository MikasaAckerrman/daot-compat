name: Build ODM Aeronautics Compat

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Java 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
    
    - name: Make gradlew executable
      run: chmod +x gradlew
    
    - name: Build with Gradle
      run: ./gradlew clean build
    
    - name: Upload JAR artifact
      uses: actions/upload-artifact@v3
      with:
        name: daot-compat-jar
        path: build/libs/*.jar
    
    - name: Create Release
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: softprops/action-gh-release@v1
      with:
        files: build/libs/*.jar
        tag_name: v1.3.5
        body: |
          # ODM Aeronautics Compat v1.3.5
          
          ## Fixes Applied
          - FIX #3: Removed rope auto-restoration on SPACE release
          - FIX #4: Increased W impulse by 50% (0.12 → 0.18)
          - FIX #7: Increased Reverse DEW by 78% (0.85 → 1.0)
          - FIX #1,2: Stabilized physics object synchronization
          - Rope Wrapping: Fixed handler synchronization (physics & rendering)
          
          ## Compatibility
          ✅ Danny's AOT - Full compatibility
          ✅ Create: Aeronautics - Full compatibility
          ✅ Grapple Hook Compat - Identical implementation
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
